name: Test

on: [push, pull_request]

jobs:
    pre_test:
        runs-on: ubuntu-latest
        outputs:
            should_skip: ${{ steps.skip_check.outputs.should_skip }}
        steps:
            - id: skip_check
              uses: fkirc/skip-duplicate-actions@v5
              with:
                  concurrent_skipping: same_content_newer

    version_check:
        if: ${{ github.event_name == 'pull_request' }}
        runs-on: ubuntu-latest
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v3
            - name: root package.json version bump?
              uses: del-systems/check-if-version-bumped@v1.3
              with:
                  path: package.json
            - name: versions match (root and release)
              run: diff <(jq .version ./package.json) <(jq .version ./release/app/package.json)
              working-directory: '.'

    test:
        needs: pre_test
        if: needs.pre_test.outputs.should_skip != 'true'
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [windows-latest, ubuntu-latest] # [macos-latest, windows-latest, ubuntu-latest]

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v3

            - name: Install Node.js and NPM
              uses: actions/setup-node@v3
              with:
                  node-version: 22
                  cache: npm

            - name: npm install
              run: |
                  npm install

            - name: npm test
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  npm run package
                  npm run lint
                  npm exec tsc
                  # npm test

            # Launch the packaged app on Windows, open every tab, fail on any renderer
            # error. Proves an Electron upgrade on the OS the carts run.
            - name: Smoke test packaged app
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                  npm install --no-save playwright@1.64.1
                  node .erb/scripts/smoke-electron.mjs "release/build/win-unpacked/FIMAV Assistant.exe"

            # Surface the built Windows installer so a branch build can be
            # installed on an AV PC before it is released. This only
            # captures the exe the windows build already produces; it does not
            # change how the app is built.
            - name: Upload Windows installer
              if: matrix.os == 'windows-latest'
              uses: actions/upload-artifact@v4
              with:
                  name: fimav-assistant-setup
                  path: release/build/*.exe
                  if-no-files-found: error
