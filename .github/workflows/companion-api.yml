name: Companion API

# Weekly: does the newest Bitfocus Companion release still have every call
# the Bitfocus tab's adapter for it makes? Fails naming each missing one, so
# src/main/companion/adapters.ts can be fixed before a cart installs that
# release. See .erb/scripts/check-companion-api.ts.

on:
    schedule:
        - cron: '0 9 * * 1'
    workflow_dispatch:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v3

            - name: Install Node.js and NPM
              uses: actions/setup-node@v3
              with:
                  node-version: 18
                  cache: npm

            # Only ts-node and ws are needed; the app's postinstall builds
            # Electron parts this check does not use.
            - name: npm install
              run: npm ci --ignore-scripts

            - name: Newest Companion release
              id: release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag=$(gh release view --repo bitfocus/companion --json tagName -q .tagName)
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"

            - name: Companion source at that release
              run: git clone --depth 1 --branch "${{ steps.release.outputs.tag }}" https://github.com/bitfocus/companion.git "$RUNNER_TEMP/companion"

            - name: Check adapter calls
              run: npx ts-node --transpile-only -O '{"module":"commonjs"}' .erb/scripts/check-companion-api.ts "$RUNNER_TEMP/companion" "${{ steps.release.outputs.tag }}"
